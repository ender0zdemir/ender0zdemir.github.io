<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Gümüş Mürekkep: Okuma Yazma — 101 Katın Efsanesi">
  <defs>
    <linearGradient id="gmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="inkGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#gmBg)"/>
  <circle cx="710" cy="270" r="240" fill="url(#inkGlow)"/>

  <!-- 101-floor stylized tower silhouette on the right -->
  <g transform="translate(615, 76)">
    <rect x="40" y="340" width="160" height="124" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="62" y="220" width="116" height="120" rx="6" fill="#243247" stroke="#64748b" stroke-width="1.5"/>
    <rect x="82" y="110" width="76" height="110" rx="6" fill="#2c3d55" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="120,24 72,110 168,110" fill="url(#silver)"/>
    <!-- Glowing windows -->
    <rect x="108" y="140" width="24" height="36" rx="12" fill="#e2e8f0"/>
    <rect x="92" y="250" width="20" height="28" rx="10" fill="#fbbf24" fill-opacity="0.85"/>
    <rect x="128" y="250" width="20" height="28" rx="10" fill="#fbbf24" fill-opacity="0.85"/>
    <path d="M 120 24 L 120 6" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="120" cy="4" r="5" fill="#fbbf24"/>
  </g>

  <!-- Silver quill & parchment arc on the left -->
  <g transform="translate(82, 92)">
    <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.5"/>
    <text x="18" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="700">MAARİF SERİSİ · OLIVIA PLAY</text>

    <text x="0" y="96" fill="#f8fafc" font-family="serif" font-size="44" font-weight="700">Gümüş Mürekkep</text>
    <text x="0" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="22" font-weight="600">Okuma Yazma · 101 Katın Efsanesi</text>

    <path d="M 4 176 C 120 156, 280 202, 430 172" fill="none" stroke="url(#silver)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="430" cy="172" r="5" fill="#fbbf24"/>

    <!-- Letter tiles -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="62" height="62" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="21" y="42" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="800">A</text>
      <rect x="76" y="0" width="62" height="62" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="97" y="42" fill="#fbbf24" font-family="sans-serif" font-size="30" font-weight="800">N</text>
      <rect x="152" y="0" width="62" height="62" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="174" y="42" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="800">E</text>
      <rect x="228" y="0" width="62" height="62" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="249" y="42" fill="#7dd3fc" font-family="sans-serif" font-size="30" font-weight="800">T</text>
      <rect x="304" y="0" width="62" height="62" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="326" y="42" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="800">İ</text>
    </g>
    <text x="0" y="328" fill="#94a3b8" font-family="sans-serif" font-size="15">Ses temelli heceleme · Etkileşimli masal &amp; Google Play uygulaması</text>
  </g>
</svg>
