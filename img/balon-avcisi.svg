<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Balon Avcısı: Disleksi Testi — Eğitsel Mobil Oyun">
  <defs>
    <linearGradient id="skyBal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102542"/>
      <stop offset="55%" stop-color="#1b3a5f"/>
      <stop offset="100%" stop-color="#144b5c"/>
    </linearGradient>
    <radialGradient id="bRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff8fa3"/>
      <stop offset="100%" stop-color="#d9384a"/>
    </radialGradient>
    <radialGradient id="bGold" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="bTeal" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </radialGradient>
    <radialGradient id="bIndigo" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#skyBal)"/>

  <!-- Soft clouds -->
  <g fill="#ffffff" fill-opacity="0.06">
    <circle cx="170" cy="430" r="95"/><circle cx="260" cy="445" r="75"/>
    <circle cx="780" cy="440" r="110"/><circle cx="880" cy="460" r="85"/>
  </g>

  <!-- Left copy -->
  <g transform="translate(70, 96)">
    <rect width="246" height="32" rx="16" fill="#0f2942" stroke="#3ec9b6" stroke-opacity="0.55"/>
    <text x="18" y="21" fill="#99f6e4" font-family="sans-serif" font-size="13" font-weight="700">PEGI 3 · 100+ İNDİRME · PLAY STORE</text>

    <text x="0" y="96" fill="#f8fafc" font-family="sans-serif" font-size="42" font-weight="800">Balon Avcısı</text>
    <text x="0" y="138" fill="#fde68a" font-family="sans-serif" font-size="24" font-weight="700">Disleksi &amp; Dikkat Analizi</text>

    <text x="0" y="186" fill="#cbd5e1" font-family="sans-serif" font-size="16">Okuma güçlüğü, görsel-işitsel eşleştirme ve</text>
    <text x="0" y="212" fill="#cbd5e1" font-family="sans-serif" font-size="16">tepki süresi ölçen oyunlaştırılmış tarama.</text>

    <!-- Focus metrics pills -->
    <g transform="translate(0, 256)">
      <rect x="0" y="0" width="128" height="72" rx="14" fill="#0d1e33" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="18" y="30" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700">ODAK</text>
      <text x="18" y="54" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">b / d / p</text>

      <rect x="144" y="0" width="144" height="72" rx="14" fill="#0d1e33" stroke="#3ec9b6" stroke-opacity="0.4"/>
      <text x="162" y="30" fill="#99f6e4" font-family="monospace" font-size="12" font-weight="700">GERİ BİLDİRİM</text>
      <text x="162" y="54" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="800">Haptik + Ses</text>
    </g>
  </g>

  <!-- Floating interactive letter balloons on the right -->
  <g transform="translate(560, 48)">
    <!-- Strings -->
    <path d="M 90 198 Q 84 270 105 340" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <path d="M 245 148 Q 252 240 230 330" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <path d="M 178 308 Q 170 375 184 445" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <path d="M 304 285 Q 312 365 292 435" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2" fill="none"/>

    <!-- Balloon 1: b -->
    <ellipse cx="90" cy="120" rx="64" ry="76" fill="url(#bRed)"/>
    <ellipse cx="68" cy="88" rx="14" ry="22" fill="#ffffff" fill-opacity="0.25" transform="rotate(-20 68 88)"/>
    <text x="90" y="138" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="54" font-weight="800">b</text>

    <!-- Balloon 2: d -->
    <ellipse cx="245" cy="76" rx="58" ry="70" fill="url(#bTeal)"/>
    <ellipse cx="226" cy="48" rx="12" ry="18" fill="#ffffff" fill-opacity="0.25" transform="rotate(-20 226 48)"/>
    <text x="245" y="94" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="50" font-weight="800">d</text>

    <!-- Balloon 3: p -->
    <ellipse cx="178" cy="238" rx="62" ry="72" fill="url(#bGold)"/>
    <ellipse cx="158" cy="208" rx="13" ry="20" fill="#ffffff" fill-opacity="0.28" transform="rotate(-20 158 208)"/>
    <text x="178" y="254" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="52" font-weight="800">p</text>

    <!-- Balloon 4: q -->
    <ellipse cx="304" cy="222" rx="52" ry="62" fill="url(#bIndigo)"/>
    <text x="304" y="236" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="46" font-weight="800">q</text>

    <!-- Pop burst ring -->
    <circle cx="32" cy="285" r="24" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="6 8"/>
    <circle cx="32" cy="285" r="5" fill="#fde68a"/>
  </g>
</svg>
